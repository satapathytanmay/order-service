name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/orders-service:${{ github.sha }}

  # deploy:
  #   needs: build-and-push
  #   if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Deploy to EC2
  #       uses: appleboy/ssh-action@v1
  #       with:
  #         host: ${{ secrets.EC2_HOST }}
  #         username: ${{ secrets.EC2_USER }}
  #         key: ${{ secrets.EC2_SSH_KEY }}
  #         script: |
  #           docker pull ${{ secrets.DOCKERHUB_USERNAME }}/orders-service:${{ github.sha }}
  #           docker stop orders || true
  #           docker rm orders || true
  #           docker run -d -p 8080:6000 --name orders ${{ secrets.DOCKERHUB_USERNAME }}/orders-service:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 -c "import sys,json,base64; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print({k:c.get(k) for k in ['sub','aud','ref','repository','event_name']})" "$TOKEN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy with SSM
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/orders-service:${{ github.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"docker pull $IMAGE\",\"docker rm -f orders || true\",\"docker run -d -p 8080:6000 --name orders $IMAGE\"]" \
            --query "Command.CommandId" --output text)
          sleep 5
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"