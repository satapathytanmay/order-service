apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: tanmaydocker2/orders-service:c49158d1ecc6957af2132293e3f1d968c0a738f3
          ports:
            - containerPort: 6000
          env:
            - name: APP_ENV
              value: "prod"
          readinessProbe:
            httpGet:
              path: /
              port: 6000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 6000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi